  <rect x="804" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".12" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="850" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".44" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="758" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".08" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="804" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".28" stroke="#C9A96E" stroke-width=".4"/>
