  <rect x="534" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".45" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="584" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".15" stroke="#C9A96E" stroke-width=".5"/>
