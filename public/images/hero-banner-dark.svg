  <rect x="344" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".38" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="390" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".14" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="298" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".3" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="344" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".1" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="390" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".42" stroke="#C9A96E" stroke-width=".4"/>

