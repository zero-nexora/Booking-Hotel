  <rect x="480" y="318" width="16" height="97" fill="#221E18" stroke="#C9A96E" stroke-width=".3" opacity=".3"/>
  <rect x="744" y="318" width="16" height="97" fill="#221E18" stroke="#C9A96E" stroke-width=".3" opacity=".3"/>
