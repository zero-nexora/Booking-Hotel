  <rect x="634" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".2" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="684" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".35" stroke="#C9A96E" stroke-width=".5"/>

