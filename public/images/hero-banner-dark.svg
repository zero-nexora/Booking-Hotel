  <line x1="560" y1="415" x2="550" y2="500" stroke="#C9A96E" stroke-width=".4" opacity=".15"/>
  <line x1="640" y1="415" x2="650" y2="500" stroke="#C9A96E" stroke-width=".4" opacity=".15"/>
