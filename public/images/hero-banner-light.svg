  <rect x="280" y="250" width="180" height="180" fill="#E8E0CF" stroke="#DDD6C4" stroke-width=".6"/>
  <!-- Left wing windows -->
  <rect x="298" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".12" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="344" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".22" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="390" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".1" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="298" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".18" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="344" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".08" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="390" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".24" stroke="#C9A96E" stroke-width=".4"/>

  <!-- Right side wing -->
  <rect x="740" y="250" width="180" height="180" fill="#E8E0CF" stroke="#DDD6C4" stroke-width=".6"/>
  <!-- Right wing windows -->
  <rect x="758" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".2" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="804" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".1" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="850" y="268" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".28" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="758" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".08" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="804" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".22" stroke="#C9A96E" stroke-width=".4"/>
  <rect x="850" y="326" width="32" height="42" rx="1" fill="#C9A96E" fill-opacity=".14" stroke="#C9A96E" stroke-width=".4"/>

  <!-- Central grand entrance arch -->
  <rect x="554" y="360" width="92" height="70" fill="#F5F0E8"/>
  <path d="M554,406 A46,46 0 0,1 646,406" fill="#F5F0E8" stroke="#C9A96E" stroke-width=".8"/>
  <rect x="558" y="406" width="84" height="24" fill="#F5F0E8"/>
  <!-- Arch pilasters -->
  <rect x="548" y="396" width="10" height="34" fill="#DDD6C4"/>
  <rect x="642" y="396" width="10" height="34" fill="#DDD6C4"/>

  <!-- Driveway / forecourt lines -->
  <line x1="490" y1="430" x2="490" y2="500" stroke="#C9A96E" stroke-width=".4" opacity=".2"/>
  <line x1="560" y1="430" x2="550" y2="500" stroke="#C9A96E" stroke-width=".4" opacity=".2"/>
  <line x1="640" y1="430" x2="650" y2="500" stroke="#C9A96E" stroke-width=".4" opacity=".2"/>
  <line x1="710" y1="430" x2="710" y2="500" stroke="#C9A96E" stroke-width=".4" opacity=".2"/>

  <!-- Topiary / trees flanking -->
  <!-- Left tree -->
  <rect x="220" y="392" width="10" height="40" fill="#C9A96E" fill-opacity=".2"/>
  <ellipse cx="225" cy="385" rx="22" ry="30" fill="#DDD6C4"/>
  <ellipse cx="225" cy="380" rx="16" ry="22" fill="#D0C8B5"/>
  <!-- Right tree -->
  <rect x="970" y="392" width="10" height="40" fill="#C9A96E" fill-opacity=".2"/>
  <ellipse cx="975" cy="385" rx="22" ry="30" fill="#DDD6C4"/>
  <ellipse cx="975" cy="380" rx="16" ry="22" fill="#D0C8B5"/>

  <!-- Lamppost left -->
  <line x1="340" y1="432" x2="340" y2="320" stroke="#C9A96E" stroke-width="1.2" opacity=".4"/>
  <path d="M324,320 Q340,306 356,320" fill="#C9A96E" fill-opacity=".15" stroke="#C9A96E" stroke-width=".6"/>
  <!-- Lamppost right -->
  <line x1="860" y1="432" x2="860" y2="320" stroke="#C9A96E" stroke-width="1.2" opacity=".4"/>
  <path d="M844,320 Q860,306 876,320" fill="#C9A96E" fill-opacity=".15" stroke="#C9A96E" stroke-width=".6"/>

  <!-- Frame ornaments -->
  <line x1="0" y1="0" x2="40" y2="0" stroke="#C9A96E" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="40" stroke="#C9A96E" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1160" y2="0" stroke="#C9A96E" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="40" stroke="#C9A96E" stroke-width="1"/>
  <line x1="0" y1="500" x2="40" y2="500" stroke="#C9A96E" stroke-width="1"/>
  <line x1="0" y1="500" x2="0" y2="460" stroke="#C9A96E" stroke-width="1"/>
  <line x1="1200" y1="500" x2="1160" y2="500" stroke="#C9A96E" stroke-width="1"/>
  <line x1="1200" y1="500" x2="1200" y2="460" stroke="#C9A96E" stroke-width="1"/>
</svg>
