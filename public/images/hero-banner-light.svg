<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1200" height="500" fill="#F5F0E8"/>

  <!-- Distant mountain range — far (lightest) -->
  <polygon points="0,320 80,220 160,290 240,200 320,270 400,185 480,255 560,175 640,245 720,160 800,230 880,150 960,220 1040,165 1120,235 1200,180 1200,500 0,500" fill="#E8E0CF"/>
  <!-- Mid mountain range -->
  <polygon points="0,380 100,290 200,340 300,265 380,310 460,248 560,300 640,240 740,295 820,232 920,280 1020,225 1100,268 1200,230 1200,500 0,500" fill="#DDD6C4"/>
  <!-- Near hills -->
  <polygon points="0,430 150,360 280,400 400,350 520,390 660,345 780,385 920,342 1060,370 1200,340 1200,500 0,500" fill="#D0C8B5"/>

  <!-- Ground -->
  <rect x="0" y="430" width="1200" height="70" fill="#C8C0AA"/>

  <!-- Golden sun -->
  <circle cx="900" cy="130" r="52" fill="#C9A96E" fill-opacity=".12" stroke="#C9A96E" stroke-width=".8"/>
  <circle cx="900" cy="130" r="36" fill="#C9A96E" fill-opacity=".1"/>
  <circle cx="900" cy="130" r="22" fill="#C9A96E" fill-opacity=".15"/>

  <!-- Sun rays -->
  <line x1="900" y1="65" x2="900" y2="50" stroke="#C9A96E" stroke-width=".8" opacity=".3"/>
  <line x1="900" y1="195" x2="900" y2="210" stroke="#C9A96E" stroke-width=".8" opacity=".3"/>
  <line x1="835" y1="130" x2="820" y2="130" stroke="#C9A96E" stroke-width=".8" opacity=".3"/>
  <line x1="965" y1="130" x2="980" y2="130" stroke="#C9A96E" stroke-width=".8" opacity=".3"/>
  <line x1="854" y1="84" x2="844" y2="74" stroke="#C9A96E" stroke-width=".8" opacity=".2"/>
  <line x1="946" y1="176" x2="956" y2="186" stroke="#C9A96E" stroke-width=".8" opacity=".2"/>
  <line x1="946" y1="84" x2="956" y2="74" stroke="#C9A96E" stroke-width=".8" opacity=".2"/>
  <line x1="854" y1="176" x2="844" y2="186" stroke="#C9A96E" stroke-width=".8" opacity=".2"/>

  <!-- Grand hotel building - central -->
  <!-- Base podium -->
  <rect x="380" y="310" width="440" height="120" fill="#E8E0CF" stroke="#DDD6C4" stroke-width=".6"/>
  <!-- Podium columns -->
  <rect x="400" y="318" width="16" height="112" fill="#DDD6C4" stroke="#C9A96E" stroke-width=".3" opacity=".5"/>
  <rect x="440" y="318" width="16" height="112" fill="#DDD6C4" stroke="#C9A96E" stroke-width=".3" opacity=".5"/>
  <rect x="480" y="318" width="16" height="112" fill="#DDD6C4" stroke="#C9A96E" stroke-width=".3" opacity=".5"/>
  <rect x="744" y="318" width="16" height="112" fill="#DDD6C4" stroke="#C9A96E" stroke-width=".3" opacity=".5"/>
  <rect x="704" y="318" width="16" height="112" fill="#DDD6C4" stroke="#C9A96E" stroke-width=".3" opacity=".5"/>
  <rect x="664" y="318" width="16" height="112" fill="#DDD6C4" stroke="#C9A96E" stroke-width=".3" opacity=".5"/>

  <!-- Main tower -->
  <rect x="460" y="130" width="280" height="200" fill="#E8E0CF" stroke="#DDD6C4" stroke-width=".6"/>

  <!-- Tower windows row 1 -->
  <rect x="484" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".14" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="534" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".22" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="584" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".1" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="634" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".28" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="684" y="152" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".16" stroke="#C9A96E" stroke-width=".5"/>

  <!-- Tower windows row 2 -->
  <rect x="484" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".2" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="534" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".08" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="584" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".3" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="634" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".12" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="684" y="214" width="36" height="48" rx="2" fill="#C9A96E" fill-opacity=".24" stroke="#C9A96E" stroke-width=".5"/>

  <!-- Tower belt cornice -->
  <line x1="460" y1="275" x2="740" y2="275" stroke="#C9A96E" stroke-width=".6" opacity=".4"/>
  <rect x="460" y="273" width="280" height="3" fill="#C9A96E" fill-opacity=".1"/>

  <!-- Tower windows row 3 -->
  <rect x="484" y="282" width="36" height="34" rx="1" fill="#C9A96E" fill-opacity=".1" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="534" y="282" width="36" height="34" rx="1" fill="#C9A96E" fill-opacity=".25" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="584" y="282" width="36" height="34" rx="1" fill="#C9A96E" fill-opacity=".15" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="634" y="282" width="36" height="34" rx="1" fill="#C9A96E" fill-opacity=".08" stroke="#C9A96E" stroke-width=".5"/>
  <rect x="684" y="282" width="36" height="34" rx="1" fill="#C9A96E" fill-opacity=".2" stroke="#C9A96E" stroke-width=".5"/>

  <!-- Roof with gable -->
  <polygon points="600,60 460,130 740,130" fill="#EDE8DC" stroke="#C9A96E" stroke-width=".8"/>
  <!-- Inner gable line -->
  <polygon points="600,88 480,130 720,130" fill="none" stroke="#C9A96E" stroke-width=".3" opacity=".35"/>

  <!-- Roof finial -->
  <line x1="600" y1="22" x2="600" y2="60" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="600" cy="16" r="8" fill="#EDE8DC" stroke="#C9A96E" stroke-width="1"/>
  <circle cx="600" cy="16" r="3.5" fill="#C9A96E" fill-opacity=".5"/>

