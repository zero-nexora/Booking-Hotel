<svg viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon mark -->
  <!-- Building body -->
  <rect x="6" y="16" width="20" height="18" rx="1" fill="#C9A96E" fill-opacity=".15"/>
  <rect x="6" y="16" width="20" height="18" rx="1" stroke="#C9A96E" stroke-width="1.5"/>
  <!-- Tower -->
  <rect x="13" y="10" width="6" height="8" rx=".5" fill="#C9A96E" fill-opacity=".25"/>
  <rect x="13" y="10" width="6" height="8" rx=".5" stroke="#C9A96E" stroke-width="1.5"/>
  <!-- Roof cap line -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Windows row 1 -->
  <rect x="9" y="20" width="3" height="3" rx=".3" fill="#C9A96E" fill-opacity=".7"/>
  <rect x="14.5" y="20" width="3" height="3" rx=".3" fill="#C9A96E" fill-opacity=".9"/>
  <rect x="20" y="20" width="3" height="3" rx=".3" fill="#C9A96E" fill-opacity=".7"/>
  <!-- Windows row 2 -->
  <rect x="9" y="26" width="3" height="3" rx=".3" fill="#C9A96E" fill-opacity=".5"/>
  <rect x="20" y="26" width="3" height="3" rx=".3" fill="#C9A96E" fill-opacity=".6"/>
  <!-- Door -->
  <rect x="13.5" y="28" width="5" height="6" rx=".5" fill="#1A1612" fill-opacity=".1" stroke="#C9A96E" stroke-width="1.2"/>
  <!-- Top diamond -->
  <rect x="15" y="7" width="2" height="2" rx=".4" transform="rotate(45 16 8)" fill="#C9A96E"/>

  <!-- Wordmark -->
  <text x="38" y="22"
    font-family="'Nunito Sans', -apple-system, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="1.2"
    fill="#1A1612">Stay</text>
  <text x="72" y="22"
    font-family="'Nunito Sans', -apple-system, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="1.2"
    fill="#C9A96E">wise</text>

  <!-- Subline -->
  <text x="38" y="32"
    font-family="'Nunito Sans', -apple-system, sans-serif"
    font-size="6.5"
    font-weight="500"
    letter-spacing="2.8"
    fill="#7A6F5E">LUXURY HOTELS</text>
</svg>
